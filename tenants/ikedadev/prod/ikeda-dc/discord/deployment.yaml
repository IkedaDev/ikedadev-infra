apiVersion: apps/v1
kind: Deployment
metadata:
  name: ikeda-dc
  namespace: ikedadev-prod
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate 
  selector:
    matchLabels:
      app: ikeda-dc
  template:
    metadata:
      labels:
        app: ikeda-dc
    spec:
      containers:
      - name: bot
        image: ikedaharket/ikeda-dc:8093dd7
        imagePullPolicy: Always
        env:
        - name: NODE_ENV
          value: "production"
        - name: CLIENT_ID
          value: "924487116656869386"
        - name: GUILD_ID
          value: "1279220559787458692"
        - name: DISCORD_TOKEN
          valueFrom:
            secretKeyRef:
              name: ikeda-dc-secrets
              key: discord-token
        - name: RIOT_API_KEY
          valueFrom:
            secretKeyRef:
              name: ikeda-dc-secrets
              key: riot-api-key
        resources:
          requests:
            cpu: "50m"
            memory: "100Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"